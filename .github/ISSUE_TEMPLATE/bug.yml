name: Bug
description: Something broke or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots help. Blur names, numbers and messages first.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [Standard, Offline, Built from source]
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: Qwen3 4B, or none
