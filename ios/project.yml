# Generate Recall.xcodeproj with:  cd ios && xcodegen
name: Recall
options:
  bundleIdPrefix: app.recall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RecallCore:
    path: RecallCore
targets:
  Recall:
    type: application
    platform: iOS
    sources:
      - path: Recall
    dependencies:
      - package: RecallCore
      - framework: Frameworks/llama.xcframework
        embed: true
      - target: RecallWidget
    entitlements:
      path: Recall/Recall.entitlements
      properties:
        com.apple.security.application-groups: [group.app.recall]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.recall
        PRODUCT_NAME: Recall
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Recall
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Recall/Info.plist
      properties:
        UIAppFonts: [bricolage.ttf, plex_sans.ttf, plex_mono.ttf]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.recall.refresh, app.recall.review]
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: app.recall
            CFBundleURLSchemes: [recall]
        CFBundleDocumentTypes:
          - CFBundleTypeName: WhatsApp chat export
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, public.plain-text]
          - CFBundleTypeName: GGUF model
            LSHandlerRank: Owner
            LSItemContentTypes: [app.recall.gguf]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.recall.gguf
            UTTypeDescription: GGUF model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gguf]
  RecallWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RecallWidget
      - path: Recall/App/Shared.swift
    dependencies:
      - package: RecallCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: RecallWidget/RecallWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.recall]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.recall.widget
        PRODUCT_NAME: RecallWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Recall
        SKIP_INSTALL: YES
    info:
      path: RecallWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Recall:
    build:
      targets:
        Recall: all
        RecallWidget: all
    run:
      config: Debug
    archive:
      config: Release
